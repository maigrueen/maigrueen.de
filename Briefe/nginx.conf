server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Saubere Adressen: erst die Datei, dann der Ordner (vorab erzeugte Seiten), sonst die App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Build-Dateien ändern sich nie
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Scans und Aufnahmen: lange zwischenspeichern, aber fehlende Dateien als 404 melden
    location ~ ^/(bilder|music)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Keine Zwischenspeicherung für Startseite, Sitemap und robots.txt
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sitemap.xml { add_header Cache-Control "no-cache"; }
    location = /robots.txt { add_header Cache-Control "no-cache"; }
}
