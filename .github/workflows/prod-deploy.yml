name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 1 * * *'  # Beibehaltung deines Nightly Cron-Jobs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: maigrueen
            image: maigrueen
          - name: Briefe
            image: briefe
          - name: Dashboard
            image: dashboard
          - name: Affirmations
            image: affirmations
          - name: DogTracker
            image: dogtracker
          - name: FTEchart
            image: ftechart
          - name: PeriodTracker
            image: periodtracker
          - name: ToDoList
            image: todolist

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app.name }}
          push: true
          tags: ghcr.io/maigrueen/${{ matrix.app.image }}:latest